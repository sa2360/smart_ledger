# 先通过私有环境变量配置 AGNES_KEY / BAIDU_API_KEY / BAIDU_SECRET_KEY。
# 将 server.js 上传到 public_html/relay.js，不在此文件嵌入凭据或服务源码。
features:
  - node lts
nginx:
  root: public_html/public
  passenger:
    enabled: "on"
    app_start_command: node relay.js
commands:
  - commands:
      - mkdir -p public_html/public
      - node --check public_html/relay.js
